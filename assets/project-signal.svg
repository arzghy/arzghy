<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Faza's project index</title>
  <desc id="desc">Nine named builds across four disciplines, two finalist honors, and an animated project composition chart.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2230"/>
      <stop offset="1" stop-color="#071218"/>
    </linearGradient>
    <linearGradient id="barGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b98f45"/>
      <stop offset="0.55" stop-color="#e2c27d"/>
      <stop offset="1" stop-color="#f1dfb2"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.75" fill="#e4ecdf" fill-opacity="0.07"/>
    </pattern>
    <style>
      .mono { font-family: "Space Mono", "Cascadia Code", "Courier New", monospace; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.8s cubic-bezier(.22,1,.36,1) both; }
      .b2 { animation-delay: .16s; }
      .b3 { animation-delay: .32s; }
      .b4 { animation-delay: .48s; }
      .scanner { animation: scan 5s ease-in-out infinite; }
      .blink { animation: blink 1.8s ease-in-out infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
      @keyframes grow { from { transform: scaleX(0); opacity: .2; } to { transform: scaleX(1); opacity: 1; } }
      @keyframes scan { 0%,100% { transform: translateX(0); opacity: 0; } 12%,88% { opacity: .65; } 50% { transform: translateX(340px); opacity: .9; } }
      @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes pulse { 0%,100% { transform: scale(.8); opacity: .35; } 50% { transform: scale(1.35); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .bar,.scanner,.blink,.pulse { animation: none !important; }
        .scanner { display: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="370" rx="16" fill="url(#panel)"/>
  <rect width="1200" height="370" rx="16" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="368" rx="15" fill="none" stroke="#e2c27d" stroke-opacity="0.35"/>
  <path d="M0 58H1200M454 58V328" stroke="#e4ecdf" stroke-opacity="0.12"/>

  <g class="mono" font-size="11" letter-spacing="1.8">
    <text x="28" y="35" fill="#e2c27d">PROJECT INDEX / LIVE SIGNAL</text>
    <circle class="blink" cx="1065" cy="31" r="4" fill="#7ee787"/>
    <text x="1078" y="35" fill="#7ee787">LOCAL DATA</text>
  </g>

  <g transform="translate(50 90)">
    <text class="mono" x="0" y="0" fill="#e4ecdf" fill-opacity="0.48" font-size="10" letter-spacing="2.4">INDEX SUMMARY</text>
    <text class="serif" x="0" y="64" fill="#f1dfb2" font-size="62">09</text>
    <text class="mono" x="100" y="44" fill="#e4ecdf" font-size="13" letter-spacing="1.4">NAMED BUILDS</text>
    <text class="mono" x="100" y="64" fill="#e4ecdf" fill-opacity="0.45" font-size="10">PRODUCTS &amp; CASE STUDIES</text>
    <path d="M0 86H360" stroke="#e4ecdf" stroke-opacity="0.12"/>

    <text class="serif" x="0" y="148" fill="#e4ecdf" font-size="46">04</text>
    <text class="mono" x="100" y="137" fill="#e4ecdf" font-size="12" letter-spacing="1.4">DISCIPLINES</text>
    <text class="mono" x="100" y="156" fill="#e4ecdf" fill-opacity="0.45" font-size="10">FE / BE / FS / MOBILE</text>
    <path d="M0 170H360" stroke="#e4ecdf" stroke-opacity="0.12"/>

    <text class="serif" x="0" y="229" fill="#e4ecdf" font-size="46">02</text>
    <text class="mono" x="100" y="218" fill="#e4ecdf" font-size="12" letter-spacing="1.4">FINALIST HONORS</text>
    <text class="mono" x="100" y="237" fill="#e4ecdf" fill-opacity="0.45" font-size="10">TOP 10 / TOP 5</text>
  </g>

  <g transform="translate(500 86)">
    <text class="mono" x="0" y="0" fill="#e4ecdf" fill-opacity="0.48" font-size="10" letter-spacing="2.4">PROJECT COMPOSITION</text>
    <text class="mono" x="650" y="0" text-anchor="end" fill="#e2c27d" font-size="10">10 INDEX ENTRIES</text>

    <g stroke="#e4ecdf" stroke-opacity="0.07">
      <path d="M190 28V238M275 28V238M360 28V238M445 28V238M530 28V238"/>
    </g>

    <g class="mono" font-size="11" fill="#e4ecdf">
      <text x="0" y="56">FRONT-END</text>
      <rect x="190" y="40" width="340" height="20" rx="3" fill="#e4ecdf" fill-opacity="0.055"/>
      <rect class="bar" x="190" y="40" width="170" height="20" rx="3" fill="url(#barGold)"/>
      <text x="560" y="56" fill="#e2c27d">02</text>

      <text x="0" y="116">BACK-END</text>
      <rect x="190" y="100" width="340" height="20" rx="3" fill="#e4ecdf" fill-opacity="0.055"/>
      <rect class="bar b2" x="190" y="100" width="170" height="20" rx="3" fill="url(#barGold)"/>
      <text x="560" y="116" fill="#e2c27d">02</text>

      <text x="0" y="176">FULL-STACK</text>
      <rect x="190" y="160" width="340" height="20" rx="3" fill="#e4ecdf" fill-opacity="0.055"/>
      <rect class="bar b3" x="190" y="160" width="340" height="20" rx="3" fill="url(#barGold)"/>
      <circle class="pulse" cx="530" cy="170" r="5" fill="#f1dfb2"/>
      <text x="560" y="176" fill="#e2c27d">04</text>

      <text x="0" y="236">MOBILE</text>
      <rect x="190" y="220" width="340" height="20" rx="3" fill="#e4ecdf" fill-opacity="0.055"/>
      <rect class="bar b4" x="190" y="220" width="170" height="20" rx="3" fill="url(#barGold)"/>
      <text x="560" y="236" fill="#e2c27d">02</text>
    </g>

    <rect class="scanner" x="190" y="28" width="2" height="212" fill="#f1dfb2" opacity="0.6"/>
    <g class="mono" font-size="9" fill="#e4ecdf" fill-opacity="0.35">
      <text x="190" y="267">00</text>
      <text x="360" y="267">02</text>
      <text x="530" y="267">04</text>
    </g>
  </g>

  <path d="M28 328H1172" stroke="#e4ecdf" stroke-opacity="0.12"/>
  <text x="28" y="352" class="mono" fill="#e4ecdf" fill-opacity="0.4" font-size="9" letter-spacing="1.25">SOURCE: PORTFOLIO PROJECT INDEX · COMPOSITION INCLUDES ONE UPCOMING MOBILE PROJECT.</text>
</svg>
