<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Faza Izzaturrafi — Product Engineer</title>
  <desc id="desc">An animated editorial terminal introduction with a rotating typewriter, a glowing status light, and a gold call-to-action bar.</desc>
  <defs>
    <radialGradient id="bg" cx="58%" cy="24%" r="92%">
      <stop offset="0" stop-color="#123329"/>
      <stop offset="0.46" stop-color="#0a1b24"/>
      <stop offset="1" stop-color="#050d12"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1dfb2"/>
      <stop offset="0.5" stop-color="#e2c27d"/>
      <stop offset="1" stop-color="#b98f45"/>
    </linearGradient>
    <linearGradient id="lineGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2c27d" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#e2c27d" stop-opacity="0.75"/>
      <stop offset="0.72" stop-color="#e2c27d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e2c27d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#e4ecdf" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="clipOne"><rect class="wiper wiper-one" x="80" y="278" width="620" height="42"/></clipPath>
    <clipPath id="clipTwo"><rect class="wiper wiper-two" x="80" y="278" width="620" height="42"/></clipPath>
    <clipPath id="clipThree"><rect class="wiper wiper-three" x="80" y="278" width="620" height="42"/></clipPath>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: "Space Mono", "Cascadia Code", "Courier New", monospace; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .gold { fill: #e2c27d; }
      .line-one { animation: lineOne 18s linear infinite; }
      .line-two { opacity: 0; animation: lineTwo 18s linear infinite; }
      .line-three { opacity: 0; animation: lineThree 18s linear infinite; }
      .wiper-one { animation: typeOne 18s linear infinite; }
      .wiper-two { animation: typeTwo 18s linear infinite; }
      .wiper-three { animation: typeThree 18s linear infinite; }
      .cursor { fill: #e2c27d; animation: blink .75s step-end infinite; }
      .cursor-one { animation: cursorOne 18s linear infinite, blink .75s step-end infinite; }
      .cursor-two { opacity: 0; animation: cursorTwo 18s linear infinite, blink .75s step-end infinite; }
      .cursor-three { opacity: 0; animation: cursorThree 18s linear infinite, blink .75s step-end infinite; }
      .status-dot { animation: status 1.8s ease-in-out infinite; }
      .sheen { animation: sheen 9s ease-in-out infinite; }
      @keyframes lineOne { 0%,31.99%{opacity:1} 32%,100%{opacity:0} }
      @keyframes lineTwo { 0%,32.99%{opacity:0} 33%,65.99%{opacity:1} 66%,100%{opacity:0} }
      @keyframes lineThree { 0%,65.99%{opacity:0} 66%,100%{opacity:1} }
      @keyframes typeOne { 0%,4%{width:0} 16%,26%{width:392px} 32%,100%{width:0} }
      @keyframes typeTwo { 0%,37%{width:0} 49%,59%{width:352px} 66%,100%{width:0} }
      @keyframes typeThree { 0%,70%{width:0} 82%,93%{width:352px} 100%{width:0} }
      @keyframes cursorOne {
        0%,4%{opacity:1;transform:translateX(0)} 16%,26%{opacity:1;transform:translateX(336px)}
        32%{opacity:1;transform:translateX(0)} 32.01%,100%{opacity:0;transform:translateX(0)}
      }
      @keyframes cursorTwo {
        0%,32.99%{opacity:0;transform:translateX(0)} 33%,37%{opacity:1;transform:translateX(0)}
        49%,59%{opacity:1;transform:translateX(300px)} 66%{opacity:1;transform:translateX(0)}
        66.01%,100%{opacity:0;transform:translateX(0)}
      }
      @keyframes cursorThree {
        0%,65.99%{opacity:0;transform:translateX(0)} 66%,70%{opacity:1;transform:translateX(0)}
        82%,93%{opacity:1;transform:translateX(300px)} 100%{opacity:1;transform:translateX(0)}
      }
      @keyframes blink { 0%,48%{visibility:visible} 49%,100%{visibility:hidden} }
      @keyframes status { 0%,100%{opacity:.35} 50%{opacity:1} }
      @keyframes sheen { 0%,100%{opacity:.35} 50%{opacity:.85} }
      @media (prefers-reduced-motion: reduce) {
        .status-dot,.sheen,.cursor { animation: none !important; }
        .line-one { animation:none; opacity:1; }
        .line-two,.line-three,.cursor-two,.cursor-three { display:none; }
        .wiper-one { animation:none; width:392px; }
        .cursor-one { display:none; }
      }
    </style>
  </defs>

  <rect width="1200" height="460" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="458" rx="17" fill="none" stroke="#e2c27d" stroke-opacity="0.42"/>
  <path d="M0 62H1200" stroke="#e4ecdf" stroke-opacity="0.12"/>
  <path d="M62 0V460M1138 0V460" stroke="#e4ecdf" stroke-opacity="0.07"/>

  <g class="mono" font-size="12" letter-spacing="1.6">
    <circle cx="28" cy="31" r="4" fill="#b98f45"/>
    <circle cx="44" cy="31" r="4" fill="#e2c27d" fill-opacity="0.55"/>
    <circle cx="60" cy="31" r="4" fill="#e4ecdf" fill-opacity="0.25"/>
    <text x="82" y="36" fill="#e4ecdf" fill-opacity="0.72">FAZA / PROFILE.md</text>
    <circle class="status-dot" cx="1020" cy="31" r="4" fill="#7ee787" filter="url(#softGlow)"/>
    <text x="1034" y="36" fill="#7ee787">SYSTEM ONLINE</text>
  </g>

  <g>
    <text x="80" y="125" class="mono gold" font-size="12" letter-spacing="3.2">SOFTWARE ENGINEERING STUDENT · IPB UNIVERSITY</text>
    <text x="74" y="204" class="serif" fill="#e4ecdf" font-size="72" letter-spacing="-2.4">Faza Izzaturrafi</text>
    <text x="80" y="244" class="mono" fill="#e4ecdf" fill-opacity="0.7" font-size="17" letter-spacing="6">PRODUCT ENGINEER</text>
    <path d="M80 263H1120" stroke="url(#lineGold)"/>
  </g>

  <g class="mono" font-size="20">
    <g class="line-one" clip-path="url(#clipOne)">
      <text x="80" y="309" fill="#e4ecdf"><tspan fill="#e2c27d">$ </tspan>build --useful --end-to-end</text>
    </g>
    <g class="line-two" clip-path="url(#clipTwo)">
      <text x="80" y="309" fill="#e4ecdf"><tspan fill="#e2c27d">$ </tspan>design --clarity --motion</text>
    </g>
    <g class="line-three" clip-path="url(#clipThree)">
      <text x="80" y="309" fill="#e4ecdf"><tspan fill="#e2c27d">$ </tspan>train --deploy --iterate</text>
    </g>
    <rect class="cursor cursor-one" x="80" y="286" width="3" height="28"/>
    <rect class="cursor cursor-two" x="80" y="286" width="3" height="28"/>
    <rect class="cursor cursor-three" x="80" y="286" width="3" height="28"/>
  </g>

  <g transform="translate(80 352)">
    <rect width="440" height="54" rx="27" fill="url(#gold)"/>
    <rect x="1" y="1" width="438" height="52" rx="26" fill="none" stroke="#fff" stroke-opacity="0.45"/>
    <circle cx="28" cy="27" r="19" fill="#10302c"/>
    <path d="M21 27H35M29 21L35 27L29 33" fill="none" stroke="#f1dfb2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="32" class="mono" fill="#10302c" font-size="11" font-weight="700" letter-spacing="1.7">CLEAN ARCHITECTURE, PURPOSEFUL MOTION.</text>
  </g>

  <g class="mono" font-size="10" letter-spacing="2" fill="#e4ecdf" fill-opacity="0.48">
    <text x="80" y="438">SOUTH TANGERANG, INDONESIA</text>
    <text x="1120" y="438" text-anchor="end">WEB / MOBILE / MACHINE LEARNING</text>
  </g>

  <g class="sheen" opacity="0.5">
    <path d="M690 108H1120" stroke="#e2c27d" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="1 9" stroke-linecap="round"/>
    <path d="M690 126H1120" stroke="#e2c27d" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="1 9" stroke-linecap="round"/>
  </g>
</svg>